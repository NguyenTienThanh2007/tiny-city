[project]
name = "tiny-city-api"
version = "0.0.0"
description = "Phase 0 FastAPI scaffold for TINY CITY"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.143,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
